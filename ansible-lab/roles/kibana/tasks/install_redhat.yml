---
- name: Import the Elastic GPG key
  ansible.builtin.rpm_key:
    key: "{{ elastic_gpg_key_url }}"
    state: present

- name: Define the Kibana yum repository
  ansible.builtin.yum_repository:
    name: "kibana-{{ elastic_series }}"
    file: kibana
    description: "Kibana repository for {{ elastic_series }} packages"
    baseurl: "{{ elastic_yum_baseurl }}"
    gpgcheck: true
    gpgkey: "{{ elastic_gpg_key_url }}"
    enabled: true

- name: Install Kibana
  ansible.builtin.yum:
    name: kibana
    state: present