---
- name: Check whether Kibana is already enrolled
  ansible.builtin.command: grep -q '^elasticsearch.hosts' /etc/kibana/kibana.yml
  register: kibana_enrolled
  failed_when: kibana_enrolled.rc > 1
  changed_when: false

- name: Generate a Kibana enrollment token on the Elasticsearch host
  ansible.builtin.command: >
    /usr/share/elasticsearch/bin/elasticsearch-create-enrollment-token -s kibana
  delegate_to: "{{ es_primary_host }}"
  register: kibana_token
  no_log: "{{ kibana_no_log | default(true) }}"
  when: kibana_enrolled.rc == 1

- name: Enroll Kibana using the token
  ansible.builtin.command: >
    /usr/share/kibana/bin/kibana-setup --enrollment-token {{ kibana_token.stdout }}
  no_log: "{{ kibana_no_log | default(true) }}"
  when: kibana_enrolled.rc == 1
  notify: Restart kibana

- name: Ensure Kibana can read its config
  ansible.builtin.file:
    path: /etc/kibana/kibana.yml
    owner: root
    group: kibana
    mode: "0660"