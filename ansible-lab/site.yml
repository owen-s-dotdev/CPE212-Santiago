---
- hosts: all
  become: true
  pre_tasks:

  - name: install updates (CentOS)
    tags: always
    dnf:
      update_only: yes
      update_cache: yes
    when: ansible_distribution == "CentOS"

  - name: install updates (Ubuntu)
    tags: always
    apt:
      #upgrade: dist
      update_cache: yes
    when: ansible_distribution == "Ubuntu"

  
- hosts: web_servers
  become: true
  roles:
    - role: web
      tags: web

- name: copy default html file for site   
  tags: apache, apache2, httpd
  copy:
    src: files/default_site.html 
    dest: /var/www/html/index.html 
    owner: root
    group: root 
    mode: '0644'


- hosts: db_servers
  become: true
  roles:
    - role: db
      tags: db

- hosts: file_servers
  become: true
  tasks:

  - name: install samba package
    tags: samba 
    package:
      name: samba
      state: latest
  
