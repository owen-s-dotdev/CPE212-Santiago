---
# /home/install_docker.yml
- hosts: web_servers:db_servers
# - hosts: localhost
  become: true

  pre_tasks:
    - name: Update apt packages
      ansible.builtin.apt:
        update_cache: true
      when: ansible_os_family == 'Debian'

    - name: Update dnf packages
      ansible.builtin.dnf:
        update_cache: true
      when: ansible_os_family == 'RedHat'
    
  roles:
    - role: docker
      tags: docker
