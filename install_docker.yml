---
# /home/install_docker.yml
- hosts: web_servers:db_servers
  become: true

  pre_tasks:
    - name: Update and upgrade apt packages
      ansible.builtin.apt:
        update_cache: yes
      when: ansible_os_family == 'Debian'

    - name: Update and upgrade dnf packages
      ansible.builtin.dnf:
        update_cache: yes
      when: ansible_os_family == 'RedHat'
    
  roles:
    - role: docker
      tags: docker
